# Salla Theme Review — CI gate
# Generated by the Salla Theme Reviewer VS Code extension ("Setup Git & CI Checks").
# Runs the same engine as the editor on every push and pull request.
# Errors (documented Salla rejection reasons) fail the check; require this check
# in branch protection to gate merges.
name: Salla Theme Review

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Salla theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Salla Theme Review
        working-directory: {{THEME_DIR}}
        run: node .salla-review/cli.js . --reports "$GITHUB_WORKSPACE/salla-review-reports" --fail-on {{FAIL_ON}} --github

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salla-review-report
          path: salla-review-reports/
          if-no-files-found: ignore
